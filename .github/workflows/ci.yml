name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies  # BP-M1
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install sidecar dependencies
        run: npm ci
        working-directory: sidecar

      - name: Sidecar smoke test  # CD-M2
        run: node test/smoke.js
        working-directory: sidecar

  rust:
    name: Rust (fmt + clippy + audit + test)
    # Pin to Ubuntu 22.04: libwebkit2gtk-4.1-dev is unavailable on Ubuntu 24.04
    # (ubuntu-latest switched to 24.04 in late 2024)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps (Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Create sidecar placeholder (CI)  # sidecar built separately; stub satisfies tauri-build resource check
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sharp-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/sharp-worker-x86_64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Install cargo-audit  # BP-H3
        run: cargo install cargo-audit --locked

      - name: Security audit  # BP-H3
        run: cargo audit
        working-directory: src-tauri

      - name: Tests  # CD-M3: dynamic thread count instead of hardcoded 4
        run: cargo test -- --test-threads=$(nproc)
        working-directory: src-tauri

  windows-compat:
    name: Windows compatibility check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy  # CD-H2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Create sidecar placeholder (CI)  # sidecar built separately; stub satisfies tauri-build resource check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          New-Item -ItemType File -Force -Path src-tauri\binaries\sharp-worker-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Rust check
        run: cargo check
        working-directory: src-tauri

      - name: Clippy  # CD-H2
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Frontend lint  # CD-H2
        run: pnpm lint

      - name: Frontend typecheck  # CD-H2
        run: pnpm typecheck

  e2e:  # CD-H1
    name: E2E tests (Playwright + Tauri)
    runs-on: ubuntu-22.04
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            xvfb

      - name: Create sidecar placeholder (CI)  # sidecar built separately; stub satisfies tauri-build resource check
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sharp-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/sharp-worker-x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: xvfb-run pnpm test:e2e
