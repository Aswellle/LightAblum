# src-tauri/Cargo.toml

[package]
name        = "light-album"
version     = "0.1.1"
description = "LightAlbum - Local Photo Manager"
authors     = []
edition     = "2021"
rust-version = "1.77"

[lib]
name       = "light_album_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "light-album"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"     # 文件夹选择对话框（api.folders.pick）

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 连接池（F-01: 替换单 Mutex<Connection> 解除 UI/扫描/缩略图互锁）
r2d2                = "0.8"
r2d2_sqlite         = "0.24"

# LRU 缓存（F-12: 替换 O(N) VecDeque+retain 为 O(1) LruCache）
lru                 = "0.16"

# 图片处理
image = "0.25"
webp  = "0.3"

# EXIF 解析
kamadak-exif = "0.5"

# 文件系统监听
notify               = "6"
notify-debouncer-full = "0.3"

# 文件遍历（自动跳过隐藏目录）
ignore = "0.4"

# 哈希（文件去重）
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# 并发
rayon              = "1.9"    # 线程池（缩略图生成）
crossbeam-queue    = "0.3"    # 无锁队列
crossbeam-channel  = "0.5"    # 跨线程通信

# 工具
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
dirs-next = "2"               # 跨平台数据目录路径

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 错误处理
thiserror = "1"
anyhow    = "1"

# 日志
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 密码哈希（私密相册）
bcrypt = "0.19"

# SEC-H3: HMAC-SHA256 session tokens for private album authorization
hmac   = "0.12"
sha2   = "0.10"
base64 = "0.22"

[dev-dependencies]
# Phase-E 测试工具
tempfile  = "3"    # 临时文件/目录（Rust 单元测试隔离用）
criterion = { version = "0.5", features = ["html_reports"] }  # 基准测试框架

[[bench]]
name    = "scan_throughput"
path = "../tests/bench/scan_throughput.rs"
harness = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = 3
[package.metadata]
